<section class="auth-card">
  <h1>Restablecer contraseña</h1>

  @if (loading()) {
    <p>Verificando enlace...</p>
  } @else if (email() && !done()) {
    <form (ngSubmit)="confirm()">
      <p>Cuenta: <strong>{{ email() }}</strong></p>
      <label>
        Nueva contraseña (mínimo 8 caracteres)
        <input
          type="password"
          required
          minlength="8"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
          name="newPassword"
        />
      </label>
      <button type="submit" [disabled]="busy()">Restablecer contraseña</button>
    </form>
  }

  @if (statusMessage()) {
    <p class="status" [class.error]="statusIsError()">{{ statusMessage() }}</p>
  }
</section>
